[project]
name = "alphastack"
version = "0.1.0"
description = "주가지수 데이터 기반 등락 방향 예측과 성과 검증 — 팀 적층 1차 프로젝트"
requires-python = ">=3.12"
license = { text = "MIT" }

# 런타임이 **실제로 import 하는 것만** 적는다.
# 실측 근거: `grep -rhoE '^\s*(from|import)\s+\w+' common/ ingest/ timeseries/ scripts/` (2026-08-25)
#   → 이관 코드가 쓰는 서드파티는 numpy · sqlalchemy · yfinance 셋뿐이었다.
#   나머지는 1차 프로젝트를 위해 새로 들이는 것이다.
#
# ⚠️ 버전은 추측이 아니라 실측이다. numpy 2.5.1 · pandas 3.0.5 는 상당히 앞선
#    버전이라 ML 라이브러리와 ABI 가 어긋날 수 있어, 2026-08-25 에 실제로 설치해
#    7종 전부 import 되는 것을 확인한 뒤 이 조합을 고정했다.
dependencies = [
  # ── 이관 코드가 이미 쓰던 것 ──────────────────────────────
  "numpy==2.5.1",          # timeseries 전체가 이것 하나로 짜여 있다
  "sqlalchemy==2.0.52",    # common/db.py — Postgres 어댑터
  "yfinance==1.5.2",       # clients/yf_data.py — 해외 지수 대조군

  # ── 1차 프로젝트가 새로 들이는 것 ─────────────────────────
  "pandas==3.0.5",         # 피처 표(feature table) 조작
  "pyarrow==25.0.1",       # 스냅샷 parquet (F-02). pandas 3.0 은 parquet 에 이게 필요하다
  "scipy==1.18.1",         # sklearn 이 요구한다 (직접 쓰지는 않는다)
  "scikit-learn==1.9.0",   # RandomForest · 지표 · 분할기
  "lightgbm==4.7.0",       # ★ 로컬 학습 (배포판이 GPU 빌드가 아니라 코어 수가 좌우한다)
  "xgboost==3.4.1",        # 모델 비교군
  "joblib==1.5.3",         # 학습된 모델 저장·로드

  # ── 크롤링 가드 ───────────────────────────────────────────
  # ⚠️ **0.6.2 이상이어야 한다** — 0.6.1 이하에 CVE-2026-55520 이 있다.
  #    표준 라이브러리(`urllib.robotparser`)를 쓰지 않는 이유는 그쪽이 명시적으로
  #    금지된 URL 에 can_fetch()=True 를 주기 때문이다(와일드카드를 %2A 로 인코딩해
  #    버린다, 실측 2026-08-26). 차단 가드가 허용 쪽으로 틀리면 없느니만 못하다.
  "protego==0.6.2",

  # ── 최소 API (② 대시보드가 읽을 계약) ─────────────────────
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
# ⚠️ 개발·검증에만 쓴다. 배포본이 import 하지 않는다.
dev = [
  "pytest>=8.0",
  "ruff>=0.14",

  # ── 설명용 노트북 (`notebooks/`) ──────────────────────────
  # 왜 넣나 — 팀원 넷이 **데이터가 실제로 어떻게 생겼는지**를 코드와 함께 따라갈 수
  # 있어야 한다. 수업 자료(`learning/09-finance-ml`)가 쓰는 형식이 이것이고,
  # GitHub 웹이 `.ipynb` 를 그대로 렌더링해 주므로 받지 않고도 읽을 수 있다.
  #
  # 셋만 넣는다. `jupyterlab` 은 브라우저로 편집할 때만 필요한데, VS Code 와
  # GitHub 웹으로 충분해서 무겁게 들이지 않는다 — 필요한 사람이 각자 깐다.
  #   nbformat  노트북 파일을 만들고 읽는다
  #   nbclient  실행해서 출력을 채운다 (빈 노트북은 내지 않는다)
  #   ipykernel 그 실행이 쓰는 커널
  #
  # 버전은 추측이 아니라 실측이다 — 2026-08-31 에 실제로 설치해 `__version__` 으로 확인했다.
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 패키지를 저장소 루트에 평탄하게 둔다 (Alpha_Stack/alphastack/ 이중 중첩을 만들지 않는다).
[tool.setuptools.packages.find]
include = ["common*", "ingest*", "supply*", "timeseries*", "features*", "models*",
           "evaluation*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
